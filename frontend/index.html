<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f0d0b" />
    <meta name="description" content="三国杀移动版盒子模拟器 · 纯娱乐的开盒与招募概率模拟" />
    <title>三国杀 · 盒子模拟器</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23a3232b'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23e8c96a' font-family='serif'%3E杀%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <!--
      启动兜底：JS 正常时 Vue 挂载会整块清空这里；
      脚本被拦截 / 解析失败 / 加载 404 时会留下可读提示，
      避免只看到一片黑屏却不知道发生了什么。
    -->
    <div id="app">
      <div id="boot-tip" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#0f0d0b;color:#e8e2d4;font-family:system-ui,'Microsoft YaHei',sans-serif;text-align:center">
        <div style="max-width:540px;line-height:1.9">
          <p style="margin:0 0 10px;font-size:17px;letter-spacing:2px;color:#e8c96a">三国杀 · 盒子模拟器</p>
          <p id="boot-msg" style="margin:0;font-size:14px;color:#b9b2a3">正在载入…</p>
          <p id="boot-help" style="display:none;margin:16px 0 0;font-size:13px;color:#8f8878">
            如果长时间停在这里，请依次尝试：<br />
            1. 按 <b style="color:#e8c96a">Ctrl + Shift + R</b> 强制刷新（清掉旧缓存）<br />
            2. 关闭广告 / 脚本拦截类浏览器扩展后刷新<br />
            3. 换用新版 Edge 或 Chrome 打开<br />
            4. 双击项目里的 <b style="color:#e8c96a">检查环境.bat</b> 看是否有标 [X] 的项
          </p>
        </div>
      </div>
    </div>

    <noscript>
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f0d0b;color:#e8e2d4;font-family:system-ui,sans-serif;text-align:center;padding:24px">
        <div>
          <p style="font-size:17px;color:#e8c96a">浏览器已禁止运行 JavaScript</p>
          <p style="font-size:14px;color:#b9b2a3">请在地址栏左侧的站点设置里允许 JavaScript，然后刷新页面。</p>
        </div>
      </div>
    </noscript>

    <script>
      // 把脚本层面的失败原因交给兜底页展示
      window.__bootFailed = function (reason) {
        var msg = document.getElementById('boot-msg')
        var help = document.getElementById('boot-help')
        if (!msg) return
        window.__bootShown = true   // 已有具体原因后，不再被兜底超时提示覆盖
        msg.textContent = reason
        msg.style.color = '#e08b8b'
        if (help) help.style.display = 'block'
      }

      // 浏览器缓存了旧版 index.html 时，它引用的 JS 指纹已被新构建删除，
      // 表现为「背景在、内容空」的黑屏。这里自动带时间戳重载一次来自愈。
      window.__bootRetry = function () {
        try {
          if (sessionStorage.getItem('boot_retry') === '1') return false
          sessionStorage.setItem('boot_retry', '1')
          location.replace(location.pathname + '?fresh=' + Date.now())
          return true
        } catch (err) {
          return false
        }
      }

      window.addEventListener('error', function (e) {
        // 资源（<script>/<link>）加载失败时，error 事件不携带 message
        if (e && e.target && e.target.tagName === 'SCRIPT') {
          if (!window.__bootRetry()) {
            window.__bootFailed('主脚本加载失败：缓存已过期，请按 Ctrl + Shift + R 强制刷新')
          }
        } else if (e && e.message) {
          window.__bootFailed('脚本执行出错：' + e.message)
        }
      }, true)

      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason
        window.__bootFailed('页面初始化失败：' + ((r && (r.message || r)) || '未知原因'))
      })

      setTimeout(function () {
        var app = document.getElementById('app')
        if (app && document.getElementById('boot-msg') && !window.__bootShown) {
          window.__bootFailed('脚本没有执行（浏览器内核过旧，或扩展拦截了页面脚本）')
        }
      }, 8000)
    </script>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
